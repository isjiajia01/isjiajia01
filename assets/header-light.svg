<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 256" width="960" height="256" role="img" aria-label="Jiajia Zhang — operations research, optimization and decision systems">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .r { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
          stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 9s ease-in-out infinite; }
    .rb { animation-delay: .5s; }
    .rc { animation-delay: 1s; }
    @keyframes draw {
      0% { stroke-dashoffset: 100; opacity: 1; }
      35%, 85% { stroke-dashoffset: 0; opacity: 1; }
      95%, 100% { stroke-dashoffset: 0; opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .r { animation: none; stroke-dashoffset: 0; } }
  </style>
  <text x="0" y="60" class="mono" font-size="13" letter-spacing="2" fill="#59636e">OPERATIONS RESEARCH · OPTIMIZATION · DECISION SYSTEMS</text>
  <text x="0" y="122" class="sans" font-size="54" font-weight="700" letter-spacing="-1.5" fill="#1f2328">Jiajia Zhang</text>
  <text x="0" y="164" class="sans" font-size="19" fill="#59636e">I turn messy operational problems into models,</text>
  <text x="0" y="190" class="sans" font-size="19" fill="#59636e">and the models into software people can act on.</text>
  <text x="0" y="234" class="mono" font-size="13" fill="#59636e">MSc Mathematical Modelling &amp; Computation · DTU · Copenhagen</text>
  <g stroke="#d1d9e0" stroke-width="1" stroke-dasharray="3 4">
    <line x1="700" y1="58" x2="790" y2="34"/>
    <line x1="700" y1="58" x2="640" y2="96"/>
    <line x1="790" y1="34" x2="874" y2="62"/>
    <line x1="874" y1="62" x2="912" y2="128"/>
    <line x1="912" y1="128" x2="884" y2="204"/>
    <line x1="884" y1="204" x2="800" y2="222"/>
    <line x1="800" y1="222" x2="700" y2="214"/>
    <line x1="700" y1="214" x2="632" y2="168"/>
    <line x1="632" y1="168" x2="640" y2="96"/>
  </g>
  <g>
    <path class="r ra" d="M770 128 L700 58 L790 34 L874 62 L770 128" pathLength="100" stroke="#0969da"/>
    <path class="r rb" d="M770 128 L912 128 L884 204 L800 222 L770 128" pathLength="100" stroke="#bf8700"/>
    <path class="r rc" d="M770 128 L700 214 L632 168 L640 96 L770 128" pathLength="100" stroke="#1a7f37"/>
  </g>
  <g fill="#ffffff" stroke="#59636e" stroke-width="1.5">
    <circle cx="700" cy="58" r="5.5"/>
    <circle cx="790" cy="34" r="5.5"/>
    <circle cx="874" cy="62" r="5.5"/>
    <circle cx="912" cy="128" r="5.5"/>
    <circle cx="884" cy="204" r="5.5"/>
    <circle cx="800" cy="222" r="5.5"/>
    <circle cx="700" cy="214" r="5.5"/>
    <circle cx="632" cy="168" r="5.5"/>
    <circle cx="640" cy="96" r="5.5"/>
  </g>
  <rect x="761" y="119" width="18" height="18" rx="3" fill="#1f2328"/>
</svg>
