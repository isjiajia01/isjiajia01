name: Generate Snake

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # This file is mirrored in the private github-profile repo. Only run it in
    # the public profile repo, where Actions minutes are free and the README
    # can load the generated SVGs from the `output` branch.
    if: github.repository == 'isjiajia01/isjiajia01'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: isjiajia01
          outputs: |
            dist/snake-light.svg?color_snake=#9f1239&color_dots=#eeede8,#f6d5dc,#e8a0b0,#c9506d,#881337
            dist/snake-dark.svg?palette=github-dark&color_snake=#fda4af&color_dots=#1f1d1c,#4c2631,#7c3a4c,#c25a75,#fb7185

      - name: Publish snake
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/snake-output
          if git ls-remote --exit-code --heads origin output; then
            git worktree add /tmp/snake-output origin/output
          else
            git worktree add -B output /tmp/snake-output
          fi

          cp dist/snake-light.svg dist/snake-dark.svg /tmp/snake-output/

          cd /tmp/snake-output
          git add snake-light.svg snake-dark.svg
          git commit -m "Update contribution snake" || exit 0
          git push origin HEAD:output
